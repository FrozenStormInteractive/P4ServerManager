name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version of the packages, x.y.z. Empty builds beta packages.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NODE_VERSION: "24"
  DOTNET_VERSION: "10.0.x"

jobs:
  ui:
    name: UI (lint, type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/P4ServerManager.Daemon.UI
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/P4ServerManager.Daemon.UI/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build-only

  dotnet:
    name: .NET (build, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/P4ServerManager.Daemon.UI/package-lock.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore P4ServerManager.slnx
      - run: dotnet build P4ServerManager.slnx --configuration Release --no-restore

      - run: >-
          dotnet test --solution P4ServerManager.slnx --configuration Release --no-build
          --report-xunit-trx --results-directory "$GITHUB_WORKSPACE/TestResults"

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          files: TestResults/**/*.trx
          check_name: .NET test results

  spk-packages:
    name: Synology package (${{ matrix.arch }})
    needs: [ui, dotnet]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, armv8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/P4ServerManager.Daemon.UI/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the Synology package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          args=(--arch "$ARCH" --build-number "$RUN_NUMBER")
          if [ -n "$VERSION" ]; then
            args+=(--version "$VERSION")
          else
            args+=(--beta)
          fi
          python packaging/spk/build.py "${args[@]}"

      - name: Upload the Synology package
        uses: actions/upload-artifact@v7
        with:
          name: release-spk-${{ matrix.arch }}
          path: artifacts/spk/*-${{ matrix.arch }}-*.spk
          if-no-files-found: error

  deb-packages:
    name: Debian package (${{ matrix.arch }})
    needs: [ui, dotnet]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/P4ServerManager.Daemon.UI/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the Debian package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          args=(--arch "$ARCH" --build-number "$RUN_NUMBER")
          if [ -n "$VERSION" ]; then
            args+=(--version "$VERSION")
          fi
          python packaging/deb/build.py "${args[@]}"

      - name: Check the Debian package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          deb=$(ls artifacts/deb/*_"$ARCH".deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" > /dev/null

      - name: Upload the Debian package
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ matrix.arch }}
          path: artifacts/deb/*_${{ matrix.arch }}.deb
          if-no-files-found: error

  zip-packages:
    name: Zip (${{ matrix.rid }})
    needs: [ui, dotnet]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/P4ServerManager.Daemon.UI/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the zip
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          args=(--rid "$RID" --build-number "$RUN_NUMBER")
          if [ -n "$VERSION" ]; then
            args+=(--version "$VERSION")
          fi
          python packaging/publish.py "${args[@]}"

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          name: release-zip-${{ matrix.rid }}
          path: artifacts/zip/*-${{ matrix.rid }}-*.zip
          if-no-files-found: error
